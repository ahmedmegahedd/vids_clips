version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    volumes:
      - api_tmp:/app/apps/api/tmp

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  api_tmp:
